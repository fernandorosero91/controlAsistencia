; =========================================================
; Configuracion de PgBouncer para el sistema de asistencia
; Modo transaction: el pooler reparte conexiones reales de
; PostgreSQL entre las conexiones logicas de la API.
; =========================================================

[databases]
seminario = host=postgres port=5432 dbname=seminario

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

pool_mode = transaction
max_client_conn = 200
default_pool_size = 40
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3
max_db_connections = 80
max_user_connections = 80

server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15

query_wait_timeout = 30
query_timeout = 120
client_login_timeout = 60
tcp_keepalive = 1
tcp_keepidle = 300
tcp_keepintvl = 30
tcp_keepcnt = 4

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; En modo transaction el limite de sentencia se fija por rol en PostgreSQL
; (ver infra/docker/postgres-init/01-ajustes.sql), no como parametro de arranque.
ignore_startup_parameters = extra_float_digits,options,statement_timeout

; El archivo de usuarios lo genera el entrypoint a partir de las variables de
; entorno del despliegue (POSTGRES_USER / POSTGRES_PASSWORD). Con scram-sha-256
; la contrasena viaja cifrada en el tramo cliente-pooler y el pooler se
; autentica a su vez contra PostgreSQL.
auth_type = scram-sha-256
auth_file = /var/lib/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
