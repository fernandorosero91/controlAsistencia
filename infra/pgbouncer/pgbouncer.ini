; =========================================================
; Configuracion de PgBouncer para el sistema de asistencia
; Modo transaction: el pooler reparte conexiones reales de
; PostgreSQL entre las conexiones logicas de la API.
; =========================================================

[databases]
seminario = host=postgres port=5432 dbname=seminario

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

pool_mode = transaction
max_client_conn = 200
default_pool_size = 40
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3
max_db_connections = 80
max_user_connections = 80

server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15

query_wait_timeout = 30
query_timeout = 120
client_login_timeout = 60
tcp_keepalive = 1
tcp_keepidle = 300
tcp_keepintvl = 30
tcp_keepcnt = 4

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

ignore_startup_parameters = extra_float_digits,options

; La red de Docker es privada y el puerto 6432 solo se publica en 127.0.0.1.
; En un despliegue real cambiar a auth_type = scram-sha-256 y generar el
; userlist.txt con el hash de la contraseña de la aplicacion.
auth_type = trust
admin_users = postgres
stats_users = postgres
