# =============================================================================
# Despliegue de produccion para Dokploy.
#
#   Dokploy > Create Service > Docker Compose
#     Repository   : <este repositorio>
#     Compose Path : docker-compose.dokploy.yml
#     Environment  : copiar el contenido de .env.dokploy.example y ajustarlo
#
# Guia completa: docs/09-despliegue-dokploy.md
#
# Topologia:
#
#   Internet -> Traefik (Dokploy) -> web (nginx :80)
#                                      |-- archivos estaticos (React)
#                                      '-- /api/* -> api :3000
#                                                     |-- pgbouncer :6432 -> postgres :5432
#                                                     '-- redis :6379
#
# Solo el servicio web publica puerto. PostgreSQL, PgBouncer, Redis y la API
# quedan en la red interna del proyecto.
#
# Las migraciones y los datos iniciales se aplican solos al arrancar la API
# (infra/docker/entrada-api.sh): desplegar es suficiente, no hay que ejecutar
# comandos a mano. El servicio "seed" queda solo para resembrar a proposito.
# =============================================================================

# Datos con los que se crea el administrador, los operadores y la configuracion
# del evento la PRIMERA vez que arranca la API sobre una base vacia. Despues de
# eso ya no se usan: un redespliegue no cambia contrasenas ni configuracion.
x-datos-iniciales: &datos-iniciales
  ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador del seminario}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL en Dokploy}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en Dokploy}
  OPERADOR_PASSWORD: ${OPERADOR_PASSWORD:-}
  ADMIN_OPERADORES: ${ADMIN_OPERADORES:-6}
  SEED_ASISTENTES: ${SEED_ASISTENTES:-0}
  SEMINARIO_NOMBRE: ${SEMINARIO_NOMBRE:-IV Seminario de Ingenieria de Software}
  SEMINARIO_FECHA: ${SEMINARIO_FECHA:-2026-10-27}
  SEMINARIO_LUGAR: ${SEMINARIO_LUGAR:-Camara de Comercio - Pasto}
  SEMINARIO_FACULTAD: ${SEMINARIO_FACULTAD:-Facultad de Ingenieria}
  SEMINARIO_CONTACTO: ${SEMINARIO_CONTACTO:-311 781 7327}
  SEMINARIO_INVERSION: ${SEMINARIO_INVERSION:-$$185.000}
  SEMINARIO_HORA_INICIO: ${SEMINARIO_HORA_INICIO:-08:00}
  SEMINARIO_HORA_FIN: ${SEMINARIO_HORA_FIN:-18:00}
  SEMINARIO_TOLERANCIA_MINUTOS: ${SEMINARIO_TOLERANCIA_MINUTOS:-15}

services:
  # ---------------------------------------------------------------- base de datos
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seminario}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en Dokploy}
      TZ: America/Bogota
      PGTZ: America/Bogota
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-seminario}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - asistencia

  pgbouncer:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Bogota
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en Dokploy}
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6432 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - asistencia

  # ---------------------------------------------------------------- cache y colas
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_datos:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - asistencia

  # ---------------------------------------------------------------- API
  # Al arrancar, el entrypoint aplica las migraciones pendientes y crea los datos
  # iniciales si la base esta vacia (infra/docker/entrada-api.sh). Correccion:
  # la API habla con PgBouncer y las migraciones van directo a PostgreSQL.
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-seminario}
      DATABASE_URL_DIRECTA: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seminario}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-2}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_MS: ${CACHE_TTL_MS:-3000}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en Dokploy}
      JWT_ACCESS_TTL_SEGUNDOS: ${JWT_ACCESS_TTL_SEGUNDOS:-900}
      JWT_REFRESH_TTL_SEGUNDOS: ${JWT_REFRESH_TTL_SEGUNDOS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BASE_URL_PUBLICA: ${BASE_URL_PUBLICA:?Defina BASE_URL_PUBLICA en Dokploy}
      CERTIFICADOS_DIR: /app/apps/api/storage/certificados
      PLANTILLAS_DIR: /app/apps/api/storage/plantillas
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-1048576}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_LOGIN_VENTANA_SEGUNDOS: ${RATE_LIMIT_LOGIN_VENTANA_SEGUNDOS:-60}
      RATE_LIMIT_ESCANEO_MAX: ${RATE_LIMIT_ESCANEO_MAX:-80}
      RATE_LIMIT_ESCANEO_VENTANA_SEGUNDOS: ${RATE_LIMIT_ESCANEO_VENTANA_SEGUNDOS:-60}
      RATE_LIMIT_VERIFICACION_MAX: ${RATE_LIMIT_VERIFICACION_MAX:-20}
      RATE_LIMIT_VERIFICACION_VENTANA_SEGUNDOS: ${RATE_LIMIT_VERIFICACION_VENTANA_SEGUNDOS:-60}
      RATE_LIMIT_ADMIN_MAX: ${RATE_LIMIT_ADMIN_MAX:-600}
      RATE_LIMIT_ADMIN_VENTANA_SEGUNDOS: ${RATE_LIMIT_ADMIN_VENTANA_SEGUNDOS:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_SEGURIDAD: ${SMTP_SEGURIDAD:-starttls}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-no-reply@seminario.local}
      SMTP_REMITENTE_NOMBRE: ${SMTP_REMITENTE_NOMBRE:-Seminario}
      # Solo se leen en el primer arranque, cuando la base esta vacia.
      <<: *datos-iniciales
      TZ: America/Bogota
    volumes:
      - certificados:/app/apps/api/storage/certificados
      - plantillas:/app/apps/api/storage/plantillas
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - asistencia

  # ---------------------------------------------------------------- web (nginx + React)
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      # Acceso directo por IP:puerto, util antes de que el DNS y el certificado
      # esten listos. El dominio de Dokploy NO usa este puerto: usa el 80.
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      # asistencia: para hablar con la API (api:3000).
      # dokploy-network: la red que usa Traefik para enrutar el dominio.
      - asistencia
      - dokploy-network

  # ---------------------------------------------------------------- datos iniciales
  # Ya NO hace falta para el primer despliegue: la API crea el administrador, los
  # operadores y la configuracion sola cuando la base esta vacia.
  # Este servicio sirve para resembrar a proposito (por ejemplo, agregar mas
  # operadores despues de subir ADMIN_OPERADORES):
  #
  #   docker compose -f docker-compose.dokploy.yml --profile datos run --rm seed
  #
  # Es idempotente: no duplica filas ni cambia contrasenas existentes.
  seed:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    profiles: ['datos']
    restart: 'no'
    command: ['node', 'dist/db/seed.js']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seminario}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en Dokploy}
      <<: *datos-iniciales
      TZ: America/Bogota
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - asistencia

volumes:
  postgres_datos:
  redis_datos:
  certificados:
  plantillas:

networks:
  asistencia:
    driver: bridge
  # Red creada por Dokploy. Traefik vive ahi y solo alcanza los contenedores
  # conectados a ella; por eso el servicio web se une a las dos redes.
  # En una prueba local: docker network create dokploy-network
  dokploy-network:
    external: true
